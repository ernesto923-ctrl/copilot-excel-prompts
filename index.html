<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copilot 엑셀 데이터 분석 · 프롬프트 라이브러리</title>
<style>
  :root{
    --bg:#f6f7fb;
    --panel:#ffffff;
    --border:#e4e7ee;
    --text:#1f2430;
    --text-dim:#5b6273;
    --accent:#2f6fed;
    --accent-dim:#eaf1ff;
    --accent-text:#1a4fbf;
    --warn-bg:#fff6e5;
    --warn-border:#f3d68a;
    --warn-text:#8a6100;
    --tip-bg:#eefaf1;
    --tip-border:#b9e6c4;
    --tip-text:#1d7a3a;
    --code-bg:#f0f2f8;
    --shadow:0 1px 3px rgba(20,25,40,.06), 0 1px 2px rgba(20,25,40,.04);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161c;
      --panel:#1c1f28;
      --border:#2b2f3b;
      --text:#e9ebf2;
      --text-dim:#9aa1b4;
      --accent:#5b8dff;
      --accent-dim:#1c2942;
      --accent-text:#8fb2ff;
      --warn-bg:#2b230f;
      --warn-border:#5a4415;
      --warn-text:#e3c05a;
      --tip-bg:#12271a;
      --tip-border:#265839;
      --tip-text:#6fe6a0;
      --code-bg:#20232d;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;}
  a{color:inherit;}

  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:260px;flex:0 0 260px;background:var(--panel);border-right:1px solid var(--border);
    padding:20px 14px 20px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{padding:6px 10px 18px;}
  .brand .kicker{font-size:12px;color:var(--accent-text);font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
  .brand h1{font-size:17px;line-height:1.4;margin:6px 0 0;font-weight:800;}
  .brand p{font-size:12.5px;color:var(--text-dim);margin:6px 0 0;}

  .nav-group-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;
    padding:14px 10px 6px;font-weight:700;}
  .nav-btn{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:transparent;
    color:var(--text);font-size:13.5px;padding:9px 10px;border-radius:10px;cursor:pointer;
    font-family:inherit;line-height:1.35;
  }
  .nav-btn .num{
    flex:0 0 22px;height:22px;border-radius:7px;background:var(--code-bg);color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
  }
  .nav-btn .lbl{flex:1;}
  .nav-btn .time{font-size:10.5px;color:var(--text-dim);font-weight:600;}
  .nav-btn:hover{background:var(--code-bg);}
  .nav-btn.active{background:var(--accent-dim);color:var(--accent-text);font-weight:700;}
  .nav-btn.active .num{background:var(--accent);color:#fff;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;padding:28px 32px 80px;max-width:900px;margin:0 auto;}
  .topbar{display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap;}
  .search{
    flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);
  }
  .search input{border:none;background:transparent;outline:none;font-size:13.5px;color:var(--text);width:100%;font-family:inherit;}
  .search svg{flex:0 0 auto;opacity:.5;}
  .count-pill{font-size:12px;color:var(--text-dim);background:var(--panel);border:1px solid var(--border);
    border-radius:999px;padding:8px 14px;white-space:nowrap;box-shadow:var(--shadow);}

  .module-head{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 22px;margin-bottom:22px;box-shadow:var(--shadow);}
  .module-head .eyebrow{font-size:12px;color:var(--accent-text);font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .module-head .eyebrow .dot{opacity:.4;}
  .module-head h2{font-size:21px;margin:8px 0 4px;font-weight:800;}
  .module-head .desc{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin:6px 0 0;}
  .goal-list{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;}
  .goal-list li{font-size:13px;color:var(--text);display:flex;gap:8px;line-height:1.5;}
  .goal-list li::before{content:"✓";color:var(--tip-text);font-weight:800;flex:0 0 auto;}
  .files-box{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
  .files-box .flabel{font-size:11.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .file-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--code-bg);
    border-radius:8px;padding:5px 10px;margin:0 6px 6px 0;font-family:"SFMono-Regular",Consolas,monospace;}

  .note-box{display:flex;gap:10px;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:20px;}
  .note-box.warn{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-text);}
  .note-box.tip{background:var(--tip-bg);border:1px solid var(--tip-border);color:var(--tip-text);}
  .note-box .ic{flex:0 0 auto;font-size:16px;}

  .principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 4px;}
  .principle-card{background:var(--code-bg);border-radius:10px;padding:12px 14px;}
  .principle-card .pnum{font-size:11px;font-weight:800;color:var(--accent-text);}
  .principle-card .ptitle{font-size:13px;font-weight:700;margin-top:4px;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
  .card-tags{display:flex;gap:8px;flex-wrap:wrap;}
  .tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--accent-dim);color:var(--accent-text);}
  .tag.mod{background:var(--code-bg);color:var(--text-dim);}
  .card-title{font-size:14.5px;font-weight:800;margin:2px 0 0;}
  .prompt-box{
    background:var(--code-bg);border-radius:10px;padding:14px 16px;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:13px;line-height:1.65;
    white-space:pre-wrap;word-break:break-word;color:var(--text);
    display:flex;flex-direction:column;gap:12px;
  }
  .copy-btn{
    align-self:flex-end;flex:0 0 auto;border:1px solid var(--border);background:var(--panel);
    color:var(--text-dim);border-radius:8px;padding:7px 12px;font-size:11.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:5px;font-family:inherit;transition:background .15s,color .15s,border-color .15s;
  }
  .copy-btn:hover{background:var(--accent-dim);color:var(--accent-text);border-color:var(--accent);}
  .copy-btn.copied{background:var(--tip-bg);color:var(--tip-text);border-color:var(--tip-border);}
  .card-tip{margin-top:10px;font-size:12.5px;color:var(--text-dim);line-height:1.6;display:flex;gap:7px;}
  .card-tip b{color:var(--text);font-weight:700;}

  .empty{text-align:center;color:var(--text-dim);padding:60px 20px;font-size:13.5px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .footer-note{text-align:center;font-size:11.5px;color:var(--text-dim);margin-top:36px;line-height:1.7;}

  /* mobile */
  .menu-toggle{display:none;}
  @media (max-width: 860px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);
      transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0);}
    .sidebar.open{transform:translateX(0);box-shadow:20px 0 60px rgba(0,0,0,.25);}
    .main{padding:20px 16px 70px;}
    .menu-toggle{
      display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--panel);
      border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;
      font-family:inherit;box-shadow:var(--shadow);
    }
    .backdrop{display:none;position:fixed;inset:0;background:rgba(10,12,18,.4);z-index:30;}
    .backdrop.show{display:block;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="kicker">Prompt Library</div>
      <h1>Copilot 엑셀 데이터 분석</h1>
      <p>데이터에서 답을 찾는 실무 분석법 · 교육생용 프롬프트 모음</p>
    </div>
    <div class="nav-group-label">보기</div>
    <button class="nav-btn" data-view="all"><span class="num">★</span><span class="lbl">전체 프롬프트</span></button>
    <div class="nav-group-label">모듈별 선택</div>
    <div id="navList"></div>
  </aside>

  <main class="main">
    <button class="menu-toggle" id="menuToggle">☰ 모듈 메뉴</button>
    <div class="topbar" style="margin-top:12px;">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="프롬프트 검색 (예: XLOOKUP, 피벗, 유령문자...)">
      </div>
      <div class="count-pill" id="countPill">0개 프롬프트</div>
    </div>

    <div id="moduleHead"></div>
    <div id="cardList"></div>
  </main>
</div>

<div class="toast" id="toast">프롬프트가 복사되었습니다</div>

<script>
const MODULES = [

    ],
    prompts: [
      {tag:"M코드 설명 요청", title:"파워쿼리 M코드 단계별 설명받기", text:"[M코드 붙여넣기] 이 파워쿼리 코드가 어떤 작업을 하는지 단계별로 설명해줘", tip:"고급 편집기에서 완성된 M코드를 복사해 [M코드 붙여넣기] 자리에 붙여넣고 사용하세요."},
      {tag:"M코드 재사용 수정", title:"다른 쿼리에 적용하도록 M코드 수정 요청", text:"[M코드 붙여넣기] 이 코드를 지역별주문내역(3) 쿼리에도 적용할 수 있게 수정해줘", tip:"쿼리 이름만 실제 사용 중인 쿼리명으로 바꿔서 재사용할 수 있습니다."}

    prompts: [

      {tag:"XLOOKUP", title:"제품코드로 제품명·단가 조회", text:"제품코드를 기준으로 제품명과 단가를 XLOOKUP으로 가져와서 D열, G열에 채워줘", tip:"XLOOKUP이 지원되지 않는 조직에서는 VLOOKUP으로 대체 요청하세요."},
      {tag:"COPILOT() 검증", title:"조건별 다른 표 참조 수식 생성 및 대조", text:"대출종류가 '디딤돌'이면 디딤돌대출표를, '적격'이면 적격대출표를 참조해서 이율을 가져오는 수식을 만들어줘", tip:"난이도가 가장 높은 실습입니다. 원래 완성 수식(INDIRECT+VLOOKUP)과 결과를 반드시 대조하세요."}
    ]
  },
  {
    id: "m6", num: 6, title: "차트 시각화", time: "11:45 - 12:05 (20분)",
    desc: "Copilot으로 기본 차트를 자동 생성하고 다듬는 방법을 익힙니다.",
    goals: ["Copilot으로 기본 차트를 자동 생성하고 다듬을 수 있다"],
    files: ["04 차트시각화.xlsx — 막대형차트, 꺾은선형차트, 원형차트"],
    notes: [],
    prompts: [
      {tag:"차트 생성", title:"구분별·월별 막대 차트 만들기", text:"구분별 1월~4월 현황을 보여주는 막대 차트를 만들어줘", tip:"생성 후 레이블·범례·색상을 직접 다듬는 과정까지 함께 실습하세요."},
      {tag:"차트 추천", title:"데이터에 맞는 차트 유형 추천받기", text:"이 데이터에 어떤 차트가 어울릴지 추천해줘", tip:"분류/비교/분포/관계/트렌드 등 차트 선택 원칙과 연결해 설명하면 좋습니다."}
    ]
  },
  {
    id: "m7", num: 7, title: "피벗테이블 활용", time: "12:05 - 12:25 (20분)",
    desc: "Copilot으로 피벗테이블과 슬라이서를 자동 생성하는 방법을 익힙니다.",
    goals: ["Copilot으로 피벗테이블과 슬라이서를 자동 생성할 수 있다"],
    files: ["06 엑셀BI.xlsx — 판매"],
    notes: [],
    prompts: [
      {tag:"피벗 생성", title:"연도별·채널별 매출 합계 피벗테이블", text:"판매 시트를 연도별, 채널별 매출 합계로 피벗테이블을 만들어줘", tip:"생성된 피벗의 필드 배치가 의도와 다르면 직접 수정하는 방법도 함께 안내하세요."},
      {tag:"슬라이서 추가", title:"피벗테이블에 슬라이서 연결", text:"방금 만든 피벗테이블에 지역 슬라이서를 추가해줘", tip:"바로 이전 프롬프트로 만든 피벗테이블에 이어서 요청하면 됩니다."}
    ]
  },
  {
    id: "m8", num: 8, title: "BI 대시보드 구성 (Before / After)", time: "12:25 - 12:45 (20분)",
    desc: "수동 제작과 Copilot 제작의 차이를 체감하고, KPI 카드와 차트를 조합한 대시보드를 직접 재현합니다.",
    goals: [
      "수동 제작과 Copilot 제작의 차이를 체감한다",
      "KPI 카드와 차트를 조합한 대시보드를 직접 재현할 수 있다"
    ],
    files: [
      "06 엑셀BI.xlsx (Before) — 대시보드 · 수동 제작",
      "06 엑셀BI_Copilot.xlsx (After) — 대시보드 · Copilot 제작"
    ],
    notes: [
      {type:"tip", ic:"💡", html:"완성 파일과 100% 동일하지 않아도 괜찮습니다. 핵심은 <b>\"이런 식으로 시키면 이렇게 나온다\"</b>를 체감하는 것입니다."}
    ],
    prompts: [
      {tag:"대시보드 재현", title:"KPI 카드 + 차트 대시보드 한 번에 만들기", text:"판매 시트를 바탕으로 총매출금액, 총매출이익, 총 판매건수, 평균 할인율을 보여주는 KPI 카드와 연도별 매출 추이 차트, 거래처 매출이익 TOP 10 차트가 있는 대시보드를 새 시트에 만들어줘", tip:"가장 긴 프롬프트지만 그만큼 구체적입니다. 시트명·지표명을 실제 데이터에 맞게 바꿔 재사용할 수 있습니다."}
    ]
  }
];

let currentView = "all";
let searchQuery = "";

const navList = document.getElementById("navList");
const moduleHead = document.getElementById("moduleHead");
const cardList = document.getElementById("cardList");
const countPill = document.getElementById("countPill");
const toast = document.getElementById("toast");
const searchInput = document.getElementById("searchInput");
const sidebar = document.getElementById("sidebar");
const backdrop = document.getElementById("backdrop");
const menuToggle = document.getElementById("menuToggle");

function buildNav(){
  const allBtn = document.querySelector('.nav-btn[data-view="all"]');
  allBtn.addEventListener("click", () => setView("all"));

  MODULES.forEach(m => {
    const btn = document.createElement("button");
    btn.className = "nav-btn";
    btn.dataset.view = m.id;
    btn.innerHTML = `<span class="num">${m.num}</span><span class="lbl">${m.title}</span>`;
    btn.addEventListener("click", () => setView(m.id));
    navList.appendChild(btn);
  });
}

function setView(view){
  currentView = view;
  document.querySelectorAll(".nav-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.view === view);
  });
  render();
  sidebar.classList.remove("open");
  backdrop.classList.remove("show");
  window.scrollTo({top:0, behavior:"smooth"});
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function highlightMatch(text, q){
  if(!q) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + "<mark>" + escapeHtml(text.slice(idx, idx+q.length)) + "</mark>" + escapeHtml(text.slice(idx+q.length));
}

function render(){
  const q = searchQuery.trim().toLowerCase();

  // Build the list of {module, prompt} pairs relevant to current view
  let pool = [];
  MODULES.forEach(m => {
    m.prompts.forEach(p => pool.push({m, p}));
  });

  if(currentView !== "all" && !q){
    pool = pool.filter(x => x.m.id === currentView);
  }
  if(q){
    pool = pool.filter(x =>
      x.p.text.toLowerCase().includes(q) ||
      x.p.title.toLowerCase().includes(q) ||
      x.p.tag.toLowerCase().includes(q) ||
      x.m.title.toLowerCase().includes(q)
    );
  }

  // Module head (only meaningful for a single module, and only when not searching)
  if(currentView !== "all" && !q){
    const m = MODULES.find(x => x.id === currentView);
    moduleHead.style.display = "";
    let html = `
      <div class="module-head">
        <div class="eyebrow">모듈 ${m.num}<span class="dot">·</span>${m.time}</div>
        <h2>${escapeHtml(m.title)}</h2>
        <p class="desc">${escapeHtml(m.desc)}</p>
        <ul class="goal-list">${m.goals.map(g=>`<li>${escapeHtml(g)}</li>`).join("")}</ul>
        ${m.files.length ? `<div class="files-box"><div class="flabel">실습 파일</div>${m.files.map(f=>`<span class="file-chip">📄 ${escapeHtml(f)}</span>`).join("")}</div>` : ""}
      </div>`;
    m.notes.forEach(n => {
      html += `<div class="note-box ${n.type}"><span class="ic">${n.ic}</span><span>${n.html}</span></div>`;
    });
    if(m.principles){
      html += `<div class="card" style="margin-bottom:20px;">
        <div class="card-title" style="margin-bottom:2px;">🎯 좋은 프롬프트 작성 원칙 5가지</div>
        <div class="principles">${m.principles.map(pr=>`<div class="principle-card"><div class="pnum">STEP ${pr.n}</div><div class="ptitle">${escapeHtml(pr.t)}</div></div>`).join("")}</div>
      </div>`;
    }
    moduleHead.innerHTML = html;
  } else if(currentView === "all" && !q){
    moduleHead.innerHTML = `
      <div class="module-head">
        <div class="eyebrow">전체 프롬프트<span class="dot">·</span>모듈 2 ~ 8</div>
        <h2>Copilot 엑셀 데이터 분석 프롬프트 라이브러리</h2>
        <p class="desc">실습에 바로 쓰는 프롬프트를 모듈 순서대로 모았습니다. 복사 버튼을 눌러 Copilot 채팅창에 붙여넣으세요. 대괄호 [ ] 표시가 있는 프롬프트는 실제 값으로 바꿔서 사용하세요.</p>
      </div>`;
  } else {
    moduleHead.innerHTML = "";
  }

  // Cards
  countPill.textContent = `${pool.length}개 프롬프트`;

  if(pool.length === 0){
    cardList.innerHTML = `<div class="empty">🔍 조건에 맞는 프롬프트가 없습니다.<br>검색어를 바꾸거나 다른 모듈을 선택해 보세요.</div>`;
    return;
  }

  cardList.innerHTML = pool.map((x,i) => {
    const {m,p} = x;
    const showModTag = currentView === "all" || q;
    return `
    <div class="card">
      <div class="card-top">
        <div>
          <div class="card-tags">
            ${showModTag ? `<span class="tag mod">모듈 ${m.num} · ${escapeHtml(m.title)}</span>` : ""}
            <span class="tag">${highlightMatch(p.tag, q)}</span>
          </div>
          <div class="card-title">${highlightMatch(p.title, q)}</div>
        </div>
      </div>
      <div class="prompt-box"><span class="prompt-text">${highlightMatch(p.text, q)}</span><button class="copy-btn" data-text="${escapeHtml(p.text)}">📋 복사</button></div>
      ${p.tip ? `<div class="card-tip">💬 <span><b>Tip.</b> ${escapeHtml(p.tip)}</span></div>` : ""}
    </div>`;
  }).join("");

  document.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", () => copyPrompt(btn));
  });
}

function copyPrompt(btn){
  const text = btn.getAttribute("data-text");
  const done = () => {
    btn.classList.add("copied");
    btn.innerHTML = "✅ 복사됨";
    showToast();
    setTimeout(() => {
      btn.classList.remove("copied");
      btn.innerHTML = "📋 복사";
    }, 1500);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  done();
}

let toastTimer;
function showToast(){
  clearTimeout(toastTimer);
  toast.classList.add("show");
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
}

searchInput.addEventListener("input", (e) => {
  searchQuery = e.target.value;
  render();
});

menuToggle.addEventListener("click", () => {
  sidebar.classList.add("open");
  backdrop.classList.add("show");
});
backdrop.addEventListener("click", () => {
  sidebar.classList.remove("open");
  backdrop.classList.remove("show");
});

buildNav();
setView("all");
</script>
</body>
</html>
