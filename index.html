<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copilot 엑셀 데이터 분석 · 프롬프트 라이브러리</title>
<style>
  :root{
    --bg:#f5f6fa;
    --panel:#ffffff;
    --border:#e5e7ef;
    --text:#1c202b;
    --text-dim:#5c6274;
    --text-faint:#8a90a3;
    --accent:#2f6fed;
    --accent2:#7c3aed;
    --accent-dim:#eaf1ff;
    --accent-text:#1a4fbf;
    --warn-bg:#fff6e5;
    --warn-border:#f3d68a;
    --warn-text:#8a6100;
    --tip-bg:#eefaf1;
    --tip-border:#b9e6c4;
    --tip-text:#1d7a3a;
    --code-bg:#f1f2f8;
    --step-bg:#f8f8fc;
    --shadow:0 1px 3px rgba(20,25,40,.06), 0 1px 2px rgba(20,25,40,.04);
    --shadow-lg:0 10px 30px rgba(30,40,80,.10);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131520;
      --panel:#1b1e2a;
      --border:#2b2f40;
      --text:#eceef5;
      --text-dim:#a2a8bd;
      --text-faint:#6f7488;
      --accent:#6c93ff;
      --accent2:#a78bfa;
      --accent-dim:#20243a;
      --accent-text:#93b4ff;
      --warn-bg:#2b230f;
      --warn-border:#5a4415;
      --warn-text:#e3c05a;
      --tip-bg:#12271a;
      --tip-border:#265839;
      --tip-text:#6fe6a0;
      --code-bg:#20233052;
      --code-bg:#212437;
      --step-bg:#1a1d2b;
      --shadow:0 1px 3px rgba(0,0,0,.4);
      --shadow-lg:0 10px 30px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;font-size:15px;}
  a{color:inherit;}
  ::selection{background:var(--accent);color:#fff;}

  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:272px;flex:0 0 272px;background:var(--panel);border-right:1px solid var(--border);
    padding:22px 14px 20px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{padding:4px 10px 20px;}
  .brand .logo-row{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
  .brand .logo-dot{
    width:34px;height:34px;border-radius:10px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 14px rgba(47,111,237,.35);
  }
  .brand .kicker{font-size:11px;color:var(--accent-text);font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
  .brand h1{
    font-size:19px;line-height:1.32;margin:2px 0 0;font-weight:800;letter-spacing:-.01em;
    background:linear-gradient(100deg,var(--text) 30%,var(--accent) 78%,var(--accent2) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand p{font-size:12.5px;color:var(--text-dim);margin:8px 0 0;line-height:1.6;}
  .brand .meta-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .brand .meta-pill{font-size:10.5px;font-weight:700;color:var(--text-dim);background:var(--code-bg);
    border-radius:999px;padding:4px 9px;}

  .nav-group-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.07em;
    padding:16px 10px 6px;font-weight:800;}
  .nav-btn{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:transparent;
    color:var(--text);font-size:13.5px;padding:9px 10px;border-radius:10px;cursor:pointer;
    font-family:inherit;line-height:1.35;
  }
  .nav-btn .num{
    flex:0 0 24px;height:24px;border-radius:7px;background:var(--code-bg);color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
  }
  .nav-btn .lbl{flex:1;}
  .nav-btn .cnt{font-size:10px;color:var(--text-faint);font-weight:700;background:var(--code-bg);border-radius:999px;padding:1px 6px;}
  .nav-btn:hover{background:var(--code-bg);}
  .nav-btn.active{background:var(--accent-dim);color:var(--accent-text);font-weight:700;}
  .nav-btn.active .num{background:var(--accent);color:#fff;}
  .nav-btn.active .cnt{background:transparent;color:var(--accent-text);}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;padding:30px 34px 90px;max-width:920px;margin:0 auto;}
  .topbar{display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap;}
  .search{
    flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);
  }
  .search input{border:none;background:transparent;outline:none;font-size:13.5px;color:var(--text);width:100%;font-family:inherit;}
  .search svg{flex:0 0 auto;opacity:.5;}
  .count-pill{font-size:12px;color:var(--text-dim);background:var(--panel);border:1px solid var(--border);
    border-radius:999px;padding:8px 14px;white-space:nowrap;box-shadow:var(--shadow);font-weight:600;}

  /* Hero (only on "all" view) */
  .hero{
    position:relative;overflow:hidden;border-radius:20px;padding:34px 30px;margin-bottom:26px;
    background:
      radial-gradient(120% 160% at 0% 0%, rgba(124,58,237,.16), transparent 55%),
      radial-gradient(120% 160% at 100% 0%, rgba(47,111,237,.18), transparent 55%),
      var(--panel);
    border:1px solid var(--border);box-shadow:var(--shadow-lg);
  }
  .hero .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent-text);background:var(--accent-dim);padding:6px 12px;border-radius:999px;}
  .hero h1{
    margin:16px 0 0;font-size:clamp(26px,4vw,38px);line-height:1.18;font-weight:900;letter-spacing:-.02em;
    background:linear-gradient(100deg,var(--text) 15%,var(--accent) 65%,var(--accent2) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero .sub{font-size:14.5px;color:var(--text-dim);margin:12px 0 0;line-height:1.7;max-width:640px;}
  .hero .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
  .hero .meta-row span{font-size:12px;font-weight:700;color:var(--text);background:var(--code-bg);
    border-radius:999px;padding:6px 13px;display:flex;align-items:center;gap:6px;}
  .hero .stat-row{display:flex;gap:22px;margin-top:22px;flex-wrap:wrap;}
  .hero .stat b{display:block;font-size:22px;font-weight:900;color:var(--accent-text);}
  .hero .stat span{font-size:11.5px;color:var(--text-faint);font-weight:600;}

  .module-head{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px 24px;margin-bottom:22px;box-shadow:var(--shadow);}
  .module-head .eyebrow{font-size:12px;color:var(--accent-text);font-weight:800;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .module-head .eyebrow .dot{opacity:.4;}
  .module-head h2{font-size:23px;margin:9px 0 6px;font-weight:900;letter-spacing:-.01em;}
  .module-head .desc{font-size:13.8px;color:var(--text-dim);line-height:1.75;margin:6px 0 0;}
  .agenda-list{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0;
    border-top:1px dashed var(--border);}
  .agenda-list li{font-size:12.8px;color:var(--text);display:flex;gap:10px;line-height:1.5;padding:9px 2px;
    border-bottom:1px dashed var(--border);align-items:baseline;}
  .agenda-list li .atime{flex:0 0 44px;color:var(--accent-text);font-weight:800;font-size:11.5px;}
  .agenda-list li .atxt{flex:1;color:var(--text-dim);}

  .note-box{display:flex;gap:10px;border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.7;margin-bottom:16px;}
  .note-box.warn{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-text);}
  .note-box.tip{background:var(--tip-bg);border:1px solid var(--tip-border);color:var(--tip-text);}
  .note-box .ic{flex:0 0 auto;font-size:16px;}

  .formula-box{background:var(--code-bg);border-radius:12px;padding:14px 16px;margin:16px 0 4px;}
  .formula-box .flabel{font-size:11px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
  .formula-chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .formula-chip{font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;}
  .formula-chip b{color:var(--accent-text);margin-right:4px;}

  .section-label{font-size:12px;font-weight:800;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;
    margin:26px 2px 12px;display:flex;align-items:center;gap:8px;}
  .section-label:first-of-type{margin-top:4px;}
  .section-label::after{content:"";flex:1;height:1px;background:var(--border);}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px;}
  .card-tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .tag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--accent-dim);color:var(--accent-text);}
  .tag.mod{background:var(--code-bg);color:var(--text-dim);font-weight:700;}
  .tag.mode-direct{background:var(--tip-bg);color:var(--tip-text);}
  .tag.mode-copilot{background:var(--accent-dim);color:var(--accent-text);}
  .card-title{font-size:15.5px;font-weight:800;margin:6px 0 0;letter-spacing:-.005em;}
  .card-context{font-size:12.5px;color:var(--text-dim);margin:6px 0 14px;line-height:1.65;}

  .step-list{display:flex;flex-direction:column;gap:10px;}
  .step-row{display:flex;gap:12px;align-items:flex-start;}
  .step-badge{
    flex:0 0 auto;min-width:26px;height:26px;padding:0 6px;border-radius:8px;background:var(--accent-dim);
    color:var(--accent-text);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;
    margin-top:2px;
  }
  .step-body{flex:1;min-width:0;}
  .step-label{font-size:12px;font-weight:800;color:var(--text);margin-bottom:6px;}
  .prompt-box{
    background:var(--step-bg);border:1px solid var(--border);border-radius:10px;padding:13px 15px;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:12.8px;line-height:1.7;
    white-space:pre-wrap;word-break:break-word;color:var(--text);
    display:flex;flex-direction:column;gap:10px;
  }
  .prompt-box.long{font-size:12.3px;}
  .copy-btn{
    align-self:flex-end;flex:0 0 auto;border:1px solid var(--border);background:var(--panel);
    color:var(--text-dim);border-radius:8px;padding:7px 12px;font-size:11.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:5px;font-family:inherit;transition:background .15s,color .15s,border-color .15s;
  }
  .copy-btn:hover{background:var(--accent-dim);color:var(--accent-text);border-color:var(--accent);}
  .copy-btn.copied{background:var(--tip-bg);color:var(--tip-text);border-color:var(--tip-border);}
  .card-tip{margin-top:14px;font-size:12.5px;color:var(--text-dim);line-height:1.7;display:flex;gap:7px;
    padding-top:12px;border-top:1px dashed var(--border);}
  .card-tip b{color:var(--text);font-weight:700;}

  .empty{text-align:center;color:var(--text-dim);padding:70px 20px;font-size:13.5px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .footer-note{text-align:center;font-size:11.5px;color:var(--text-faint);margin-top:40px;line-height:1.8;}

  mark{background:#ffe58a;color:#3a2c00;border-radius:3px;padding:0 2px;}
  @media (prefers-color-scheme: dark){ mark{background:#6b5a1a;color:#ffe58a;} }

  /* mobile */
  .menu-toggle{display:none;}
  @media (max-width: 860px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;}
    .sidebar.open{transform:translateX(0);box-shadow:20px 0 60px rgba(0,0,0,.25);}
    .main{padding:20px 16px 70px;}
    .menu-toggle{
      display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--panel);
      border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;
      font-family:inherit;box-shadow:var(--shadow);
    }
    .backdrop{display:none;position:fixed;inset:0;background:rgba(10,12,18,.4);z-index:30;}
    .backdrop.show{display:block;}
    .hero{padding:24px 20px;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo-row">
        <div class="logo-dot">⚡</div>
        <div class="kicker">Prompt Library</div>
      </div>
      <h1>Copilot 엑셀 데이터 분석</h1>
      <p>데이터에서 답을 찾는 실무 분석법 · 강의안 4</p>
      <div class="meta-pills">
        <span class="meta-pill">🏢 에보닉코리아</span>
        <span class="meta-pill">⏱ 4시간 과정</span>
        <span class="meta-pill">👤 박미정 강사</span>
      </div>
    </div>
    <div class="nav-group-label">보기</div>
    <button class="nav-btn" data-view="all"><span class="num">★</span><span class="lbl">전체 프롬프트</span></button>
    <div class="nav-group-label">모듈별 선택</div>
    <div id="navList"></div>
  </aside>

  <main class="main">
    <button class="menu-toggle" id="menuToggle">☰ 모듈 메뉴</button>
    <div class="topbar" style="margin-top:12px;">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="프롬프트 검색 (예: XLOOKUP, 피벗, 감성분석, 대시보드...)">
      </div>
      <div class="count-pill" id="countPill">0개 프롬프트</div>
    </div>

    <div id="moduleHead"></div>
    <div id="cardList"></div>
  </main>
</div>

<div class="toast" id="toast">프롬프트가 복사되었습니다</div>

<script>
/* ---------------- Data ---------------- */
const FORMULA = ["대상","기준","작업","출력","검증"];

const MODULES = [
  {
    id:"m1", num:1, title:"Excel Copilot과 데이터 분석 워크플로우", time:"60분",
    headline:"Copilot이 잘하는 일과 사람이 통제할 일을 구분한다.",
    agenda:[
      {t:"Copilot이 잘하는 일, 맡기지 말아야 할 일", time:"8분"},
      {t:"Edit·Plan·Chat, 언제 사용할까?", time:"10분"},
      {t:"분석 가능한 데이터의 조건 / 분석 프롬프트 공식", time:"12분"},
      {t:"실습 1 | 오늘의 메인 데이터 진단", time:"20분"}
    ],
    notes:[
      {type:"tip", ic:"🔒", html:"유료(M365) Copilot은 <b>테넌트 경계 내에서만 처리</b>되고 모델 학습에 쓰이지 않습니다 — 실제 회사 데이터로 안심하고 실습하세요."}
    ],
    formula:true,
    practices:[
      {
        tag:"프롬프트 공식 예시", title:"5요소(대상·기준·작업·출력·검증) 프롬프트 공식 적용 예시",
        context:"오늘 모든 실습에서 이 형식이 반복됩니다 — 여기서 먼저 통째로 외워두면 이후가 쉬워집니다.",
        prompts:[
          {label:"공식 적용 예시", text:"판매 데이터에서 지역·제품·월 기준으로 매출과 이익률을 비교하고, 피벗테이블과 적절한 차트로 작성해줘. 결과가 전체 합계와 일치하는지도 확인해줘."}
        ]
      },
      {
        tag:"실습 1 · 20분", title:"오늘의 메인 데이터 진단 (구조 설명 → 문제 탐색 → KPI 제안)",
        context:"엑셀BI.xlsx(판매 시트)를 열고 아래 3단계를 순서대로 입력합니다.",
        prompts:[
          {step:"STEP 1", label:"구조 설명", text:"이 데이터의 행과 열 구조, 분석 단위, 주요 필드를 설명해줘."},
          {step:"STEP 2", label:"문제 탐색", text:"분석 전에 확인해야 할 데이터 품질 문제를 찾아줘."},
          {step:"STEP 3", label:"질문 설계", text:"경영 관점에서 확인할 KPI와 분석 질문을 제안해줘."}
        ],
        tip:"Copilot 응답의 숫자(행/열 개수, 결측치 위치)를 반드시 원본과 직접 대조하세요 — 검증 습관을 첫 실습부터 만듭니다."
      }
    ]
  },
  {
    id:"m2", num:2, title:"Power Query 기반 데이터 통합 및 분석 준비", time:"60분",
    headline:"처음 1회는 손으로, 이후 반복은 Copilot에게 위임한다.",
    agenda:[
      {t:"Power Query는 “분석 데이터 공급 장치” / 결측값은 Copilot에게", time:"10분"},
      {t:"실습 2-1 [직접] 지역별 주문내역 변환", time:"12분"},
      {t:"특수문자·유령문자 / 짧은 시연: Copilot 정제의 한계", time:"10분"},
      {t:"텍스트 나누기·중복 제거 비교 / 실습 2-2 폴더 통합 / M 코드 설명·수정·검증", time:"15분"},
      {t:"실습 2-3 [Copilot 위임] 새 파일 추가 후 반영", time:"13분"}
    ],
    notes:[
      {type:"warn", ic:"⚠️", html:"특수문자·유령문자 시연에서 Copilot이 <b>실제로 놓치는 사례</b>를 반드시 라이브로 보여주세요 — \"AI 실패가 목적이 아니라, 여기서부터는 사람이 확인해야 한다\"는 기준을 세우는 구간입니다."}
    ],
    practices:[
      {
        tag:"결측값 처리", title:"빈 셀을 위쪽 값으로 채우기",
        context:"간단한 정제는 처음부터 Copilot에게 맡기는 예시입니다.",
        prompts:[{label:"결측값 채우기", text:"분류 열의 빈 셀을 위쪽 값으로 채워줘."}]

"현재 통합문서의 `판매`, `제품`, `거래처` 데이터를 분석해 경영진용 판매 실적 대시보드를 만들어줘.\n\n1. 시트 구성\n- 새 시트 이름: `대시보드`\n- 분석 기간과 최종 업데이트 날짜를 상단에 표시\n- 원본 데이터 시트는 변경하지 말 것\n\n2. 핵심 KPI\n- 총 매출금액\n- 총 매출이익\n- 매출이익률\n- 총 판매건수\n- 평균 할인율\n- 거래처 수\n- KPI는 큰 숫자의 카드 형태로 배치하고 적절한 숫자 서식을 적용\n\n3. 분석 항목\n- 연도별 매출과 전년 대비 성장률\n- 매출이익 기준 TOP 10 거래처 및 전체 이익 대비 비중\n- 지역별 매출 순위\n- 요일별 매출과 비중\n- 제품분류별 매출 구성\n- 제품분류별 ABC-Pareto 분석\n  · 누적 매출 비중 65% 이내: A\n  · 90% 이내: B\n  · 나머지: C\n- 매출 상위 3개 지역의 월별 추이\n\n4. 시각화\n- 연도별 매출: 세로 막대형 차트\n- 제품분류별 매출 구성: 도넛 차트\n- 상위 3개 지역 월별 매출: 표식이 있는 꺾은선형 차트\n- 차트가 표나 다른 차트와 겹치지 않도록 배치\n- 차트 제목, 범례, 축 단위와 숫자 서식을 명확히 표시\n\n5. 인사이트\n분석 결과를 바탕으로 다음 내용을 실제 계산값과 함께 작성:\n- 성장 추세\n- 핵심 거래처 집중도\n- 핵심 제품군\n- 지역 확대 기회\n- 요일별 운영 및 프로모션 제안\n\n6. 디자인\n- 경영진 보고용의 깔끔하고 전문적인 스타일\n- 진한 남색과 청록색을 주요 색상으로 사용\n- 제목, 섹션 제목, 표 머리글의 계층을 명확히 구성\n- 금액은 천 단위 구분, 비율은 소수점 1자리로 표시\n- 열 너비와 행 높이를 조정해 모든 내용이 잘 보이게 할 것\n- 표에는 조건부 서식이나 데이터 막대를 적절히 적용\n\n7. 계산 및 검증\n- 집계값은 가능한 한 원본 데이터를 참조하는 수식 또는 피벗 구조로 작성\n- 모든 2,918건의 판매 데이터를 포함\n- 총매출, 총이익 및 세부 분석 합계가 원본 데이터와 일치하는지 검증\n- 오류 수식이나 빈 차트가 없는지 확인한 뒤 완료할 것", long:true}],
        tip:"두 프롬프트 모두 2,918건 전체 판매 데이터와 원본 합계 일치 여부를 결과 검증 단계에서 반드시 확인시키세요."
      },
      {
        tag:"실습 4-3 · 인사이트", title:"경영진용 발견사항 3가지 초안",
        context:"사실 → 비교 → 의미 → 권고행동 4단계로 인사이트 문장을 구성합니다.",
        prompts:[{label:"인사이트 초안", text:"대시보드에서 경영진이 주목해야 할 발견사항 3가지를 작성해줘. 각 항목에 근거 수치, 비교 기준, 의미, 추가 행동을 포함하고 확정할 수 없는 원인은 추정이라고 표시해줘."}],
        tip:"결과는 “사람이 최종 검토” — 수치 일치, 상관을 인과로 단정하지 않기, 과장 여부, 실행 제안의 데이터 근거를 체크하세요."
      }
    ]
  }
];

const APPENDIX = {
  id:"appendix", num:"+", title:"부록 · 추가 실습후보", time:"시간 여유 시",
  headline:"기존 교안 실습만으로 시간이 남거나, 특정 모듈을 회사 맥락에 맞게 바꾸고 싶을 때 사용하는 후보 실습입니다.",
  agenda:[],
  notes:[
    {type:"tip", ic:"📁", html:"실습후보2(에보닉코리아 판매데이터)는 실제 매출 데이터가 아니라 <b>교육용으로 새로 만든 가상 데이터</b>입니다 — 원본_판매데이터 시트의 음수 수량·결측 매출액은 의도된 오류이니 실습 전 미리 안내하세요."}
  ],
  practices:[
    {
      tag:"실습후보 1 · 함수 심화", title:"영업사원별 인센티브 — 근사값 조회",
      context:"실습후보1_영업사원별_인센티브(함수 심화).xlsx — 모듈 3(함수) 심화 또는 대체용. 목표 대비 실적(%)을 구간표에서 근사값으로 조회해 지급비율을 매기는 실습으로 XLOOKUP/INDEX·MATCH의 “근사 일치” 개념을 확장합니다.",
      prompts:[{label:"근사값 조회", text:"목표/실적(%)을 기준으로 사업부별 지급비율표에서 값을 찾아 인센티브 지급비율 열을 채워줘. 근사값으로 찾아야 하는 이유도 설명해줘."}]
    }
  ]
};

const ALL_MODULES = [...MODULES, APPENDIX];

let currentView = "all";
let searchQuery = "";

const navList = document.getElementById("navList");
const moduleHead = document.getElementById("moduleHead");
const cardList = document.getElementById("cardList");
const countPill = document.getElementById("countPill");
const toast = document.getElementById("toast");
const searchInput = document.getElementById("searchInput");
const sidebar = document.getElementById("sidebar");
const backdrop = document.getElementById("backdrop");
const menuToggle = document.getElementById("menuToggle");

function promptCount(m){ return m.practices.reduce((n,p)=>n+p.prompts.length,0); }
function totalPromptCount(){ return ALL_MODULES.reduce((n,m)=>n+promptCount(m),0); }

function buildNav(){
  const allBtn = document.querySelector('.nav-btn[data-view="all"]');
  allBtn.querySelector(".cnt") || allBtn.insertAdjacentHTML("beforeend", `<span class="cnt">${totalPromptCount()}</span>`);
  allBtn.addEventListener("click", () => setView("all"));

  ALL_MODULES.forEach(m => {
    const btn = document.createElement("button");
    btn.className = "nav-btn";
    btn.dataset.view = m.id;
    btn.innerHTML = `<span class="num">${m.num}</span><span class="lbl">${m.title}</span><span class="cnt">${promptCount(m)}</span>`;
    btn.addEventListener("click", () => setView(m.id));
    navList.appendChild(btn);
  });
}

function setView(view){
  currentView = view;
  document.querySelectorAll(".nav-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.view === view);
  });
  render();
  sidebar.classList.remove("open");
  backdrop.classList.remove("show");
  window.scrollTo({top:0, behavior:"smooth"});
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function highlightMatch(text, q){
  if(!q) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + "<mark>" + escapeHtml(text.slice(idx, idx+q.length)) + "</mark>" + escapeHtml(text.slice(idx+q.length));
}

function renderHero(){
  return `
    <div class="hero">
      <span class="eyebrow">⚡ Prompt Library</span>
      <h1>Copilot 엑셀 데이터 분석</h1>
      <p class="sub">데이터에서 답을 찾는 실무 분석법 — 에보닉코리아 실무자 대상 4시간 과정의 강사 대본에서, 교육생이 실습 중 그대로 복사해 쓸 수 있는 프롬프트만 모듈별로 뽑아 정리했습니다.</p>
      <div class="meta-row">
        <span>🏢 에보닉코리아 실무자</span>
        <span>⏱ 4시간 과정</span>
        <span>👤 강사 박미정</span>
      </div>
      <div class="stat-row">
        <div class="stat"><b>${totalPromptCount()}</b><span>개 프롬프트</span></div>
        <div class="stat"><b>${MODULES.length}</b><span>개 모듈</span></div>
        <div class="stat"><b>+1</b><span>부록 실습</span></div>
      </div>
    </div>`;
}

function render(){
  const q = searchQuery.trim().toLowerCase();

  let pool = [];
  ALL_MODULES.forEach(m => {
    m.practices.forEach(pr => pool.push({m, pr}));
  });

  if(currentView !== "all" && !q){
    pool = pool.filter(x => x.m.id === currentView);
  }
  if(q){
    pool = pool.filter(x =>
      x.pr.title.toLowerCase().includes(q) ||
      x.pr.tag.toLowerCase().includes(q) ||
      x.m.title.toLowerCase().includes(q) ||
      x.pr.prompts.some(p => p.text.toLowerCase().includes(q) || p.label.toLowerCase().includes(q))
    );
  }

  const promptTotal = pool.reduce((n,x)=>n+x.pr.prompts.length,0);
  countPill.textContent = `${promptTotal}개 프롬프트`;

  // Head
  if(currentView !== "all" && !q){
    const m = ALL_MODULES.find(x => x.id === currentView);
    let html = `
      <div class="module-head">
        <div class="eyebrow">모듈 ${m.num}<span class="dot">·</span>${m.time}</div>
        <h2>${escapeHtml(m.title)}</h2>
        <p class="desc">${escapeHtml(m.headline)}</p>
        ${m.agenda.length ? `<ul class="agenda-list">${m.agenda.map(a=>`<li><span class="atime">${escapeHtml(a.time)}</span><span class="atxt">${escapeHtml(a.t)}</span></li>`).join("")}</ul>` : ""}
      </div>`;
    m.notes.forEach(n => {
      html += `<div class="note-box ${n.type}"><span class="ic">${n.ic}</span><span>${n.html}</span></div>`;
    });
    if(m.formula){
      html += `<div class="formula-box">
        <div class="flabel">🎯 분석 프롬프트 공식 — 이 5가지가 오늘 모든 프롬프트의 뼈대입니다</div>
        <div class="formula-chip-row">${FORMULA.map((f,i)=>`<span class="formula-chip"><b>${i+1}</b>${f}</span>`).join("")}</div>
      </div>`;
    }
    moduleHead.innerHTML = html;
  } else if(currentView === "all" && !q){
    moduleHead.innerHTML = renderHero();
  } else {
    moduleHead.innerHTML = "";
  }

  if(pool.length === 0){
    cardList.innerHTML = `<div class="empty">🔍 조건에 맞는 프롬프트가 없습니다.<br>검색어를 바꾸거나 다른 모듈을 선택해 보세요.</div>`;
    return;
  }

  const showModTag = currentView === "all" || q;

  cardList.innerHTML = pool.map(x => {
    const {m, pr} = x;
    const stepsHtml = pr.prompts.map(p => `
      <div class="step-row">
        ${p.step ? `<div class="step-badge">${escapeHtml(p.step)}</div>` : ""}
        <div class="step-body">
          <div class="step-label">${highlightMatch(p.label, q)}</div>
          <div class="prompt-box ${p.long ? 'long' : ''}"><span class="prompt-text">${highlightMatch(p.text, q)}</span><button class="copy-btn" data-text="${escapeHtml(p.text)}">📋 복사</button></div>
        </div>
      </div>`).join("");

    return `
    <div class="card">
      <div class="card-top">
        <div class="card-tags">
          ${showModTag ? `<span class="tag mod">모듈 ${m.num} · ${escapeHtml(m.title)}</span>` : ""}
          <span class="tag">${highlightMatch(pr.tag, q)}</span>
        </div>
      </div>
      <div class="card-title">${highlightMatch(pr.title, q)}</div>
      ${pr.context ? `<div class="card-context">${highlightMatch(pr.context, q)}</div>` : `<div style="height:12px"></div>`}
      <div class="step-list">${stepsHtml}</div>
      ${pr.tip ? `<div class="card-tip">💬 <span><b>Tip.</b> ${escapeHtml(pr.tip)}</span></div>` : ""}
    </div>`;
  }).join("");

  document.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", () => copyPrompt(btn));
  });
}

function copyPrompt(btn){
  const text = btn.getAttribute("data-text");
  const done = () => {
    btn.classList.add("copied");
    btn.innerHTML = "✅ 복사됨";
    showToast();
    setTimeout(() => {
      btn.classList.remove("copied");
      btn.innerHTML = "📋 복사";
    }, 1500);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  done();
}

let toastTimer;
function showToast(){
  clearTimeout(toastTimer);
  toast.classList.add("show");
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
}

searchInput.addEventListener("input", (e) => {
  searchQuery = e.target.value;
  render();
});

menuToggle.addEventListener("click", () => {
  sidebar.classList.add("open");
  backdrop.classList.add("show");
});
backdrop.addEventListener("click", () => {
  sidebar.classList.remove("open");
  backdrop.classList.remove("show");
});

buildNav();
setView("all");
</script>
</body>
</html>
